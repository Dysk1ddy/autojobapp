<main>

    <div>My Information</div>
    <div class="active">Work Experience</div>

  </div>
  <section data-automation-id="pageSection">
    <h3 role="heading">Work Experience</h3>
    <div data-automation-id="formField">
      <label data-automation-id="formLabel" for="wd-company">Company</label>
      <input id="wd-company" name="company" type="text" />

    <div data-automation-id="formField">
      <label data-automation-id="formLabel" for="wd-title">Job Title</label>
      <input id="wd-title" name="jobTitle" type="text" />

    <div data-automation-id="formField">
      <label data-automation-id="formLabel" for="wd-salary">What are your salary expectations?</label>
      <textarea id="wd-salary" name="salaryExpectation"></textarea>
    </div>
  </section>
  <button type="button">Continue to Next Step</button>
